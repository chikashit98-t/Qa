services:
  web:
    build: .
    volumes:
      - ./:/var/www/html
      - ./docker/certs:/etc/apache2/ssl:ro
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      DB_DSN: "mysql:host=db;dbname=happimo;charset=utf8mb4"
      DB_USER: happimo
      DB_PASSWORD: happimo
      # メールはstorage/mail.logに書き出す。実送信する場合は MAIL_DRIVER=mail
      MAIL_DRIVER: log
    depends_on:
      - db
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: happimo
      MYSQL_USER: happimo
      MYSQL_PASSWORD: happimo
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
